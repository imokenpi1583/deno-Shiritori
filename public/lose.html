<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>GAME OVER</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body style="background-color: #fff1f0; text-align: center; padding-top: 50px;">
  <h1 style="color: #f5222d; font-size: 64px; margin-bottom: 20px;">まけ;;</h1>
  <p id="message" style="font-size: 24px; color: #333;"></p>
  <p id="score" style="font-size: 24px; color: #333;">
    続いた単語の数： <span id="wordCountValue" style="color: #ff4d4f; font-size: 36px;">0</span>個
  </p>
  <br>
  <div class="result-buttons">
    <button id="back-to-title-btn" onclick="window.location.href='./index.html'">タイトル画面に戻る</button>
    <!--  追加：同じ部屋に再接続するボタン -->
    <button id="reconnect-room-btn" style="display: none;"></button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get('msg');
    if (msg) {
      document.querySelector("#message").textContent = msg;
    }

    const prevRoomName = urlParams.get("room");

    if (prevRoomName) {
      const reconnectBtn = document.getElementById("reconnect-room-btn");

      // ボタンに部屋名を含んだテキストを設定して表示
      reconnectBtn.textContent = `もう一度 部屋[${prevRoomName}] で遊ぶ`;
      reconnectBtn.style.display = "inline-block"; // ボタンを表示する

      // ボタンがクリックされたら、その部屋パラメータを持たせてゲーム画面に戻る
      reconnectBtn.onclick = () => {
        // しりとりゲーム画面のHTMLファイル名（例: game.html）に合わせて変更してください
        window.location.href = `play.html?room=${encodeURIComponent(prevRoomName)}`;
      };
    }
    const count = urlParams.get('count');
    if (count) {
      document.querySelector("#wordCountValue").textContent = count;
    }
  </script>
</body>

</html>
