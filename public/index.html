<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムしりとり対戦 - タイトル</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #2a2a2a;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    input {
      padding: 10px;
      font-size: 1.2rem;
      border-radius: 5px;
      border: none;
      width: 250px;
      margin-bottom: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>しりとりオンライン</h1>
    <p>合言葉（部屋名）を入力して出撃せよ</p>

    <input type="text" id="room-name-input" placeholder="例: G13_ROOM" maxlength="20"><br>
    <button id="enter-btn">参戦する</button>
  </div>

  <script>
    document.getElementById("enter-btn").addEventListener("click", () => {
      const roomName = document.getElementById("room-name-input").value.trim();

      if (!roomName) {
        alert("部屋名を入力してください！");
        return;
      }

      // ⭕ 【最重要】URLパラメータに部屋名をくっつけてゲーム画面にジャンプ！
      // 例: play.html?room=G13_ROOM
      window.location.href = `./play.html?room=${encodeURIComponent(roomName)}`;
    });
  </script>

</body>

</html>
