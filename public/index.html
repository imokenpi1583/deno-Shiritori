<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しりとり対戦</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a6585;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: skyblue;
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    input {
      padding: 10px;
      font-size: 1.2rem;
      border-radius: 5px;
      border: none;
      width: 250px;
      margin-bottom: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="./image/logo.png" alt="logo" width="454" height="200">
    <p>↓合言葉を入力して対戦ッ↓</p>

    <input type="text" id="room-input" placeholder="例: 弱火でじっくり" maxlength="20"><br>
    <button id="enter-btn">しりとり開始</button>
  </div>

  <script>
    document.getElementById("enter-btn").addEventListener("click", () => {
      const roomName = document.getElementById("room-input").value || "default";

      if (!roomName) {
        alert("部屋名を入力してください！");
        return;
      }

      window.location.href = `lobby.html?room=${encodeURIComponent(roomName)}`;

      document.getElementById("room-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          document.getElementById("enter-btn").click();
        }
      });
    });
  </script>

</body>

</html>
