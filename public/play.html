<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しりとりバトル</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <img src="./image/logo.png" alt="logo" width="227" height="100">

    <!-- 現在の単語を表示する場所 -->
    <div class="game-area">
        <div id="historyContainer"></div>

        <div id="current-circle-container">
            <div id="target-char-display">り</div>
        </div>
    </div>

    <div class="input-area">
        <p id="turnIndicator">接続中...</p>
        <!-- 次の文字を入力するフォーム -->
        <div class="form">
            <input id="nextWordInput" type="text" disabled />
            <button id="nextWordSendButton" disabled>送信</button>
        </div>
    </div>


    <script>
        // 1. 現在のURLのパラメータから "room" の値を引き抜く
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get("room");

        if (!roomName) {
            alert("部屋名が指定されていません。ロビーに戻ります。");
            window.location.href = "./lobby.html";
        }

        // DOM要素のキャッシュ
        const historyContainer = document.querySelector("#historyContainer");
        const turnIndicator = document.querySelector("#turnIndicator");
        const sendButton = document.querySelector("#nextWordSendButton");
        const nextWordInput = document.querySelector("#nextWordInput");
        const targetCharDisplay = document.getElementById("target-char-display");

        // 部屋名をクエリパラメータに仕込んでWebSocket接続を開始
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/shiritori-ws?room=${encodeURIComponent(roomName)}`;
        let socket;

        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                // しりとり接続チェックにはじかれたときのアラート
                if (data.type === "input_error") {
                    alert(data.message);
                    nextWordInput.value = "";
                    nextWordInput.focus();
                    return;
                }

                else if (data.type === "gameover") {
                    // WebSocketを安全に閉じる
                    if (socket) socket.close();

                    // クエリパラメータに「続いた単語の数」を乗せてリダイレクト
                    const wordCountParam = `?wordCount=${data.wordCount}`;

                    if (data.role === "spectator") {
                        // 観戦者の場合は勝敗がないので、ひとまずロビーか観戦終了用のページへ
                        alert(`試合終了！続いた単語の数: ${data.wordCount}個`);
                        window.location.href = `win.html?msg=${encodeURIComponent(errorM)}&count=${count}&room=${encodeURIComponent(roomName)}`;
                    } else if (data.result === "win") {
                        // 勝利時は win.html へ
                        window.location.href = `win.html?msg=${encodeURIComponent(msg)}&count=${count}&room=${encodeURIComponent(roomName)}`;
                    } else {
                        // 敗北時は lose.html へ
                        window.location.href = `lose.html?msg=${encodeURIComponent(msg)}&count=${count}&room=${encodeURIComponent(roomName)}`;
                    }
                    return;
                }

                // 観戦者接続
                if (data.type === "spectate_start") {
                    turnIndicator.textContent = data.message;
                    sendButton.disabled = true;
                    nextWordInput.disabled = true;

                    historyContainer.innerHTML = data.recentWords
                        .map(word => `<span class="history-word">${word}</span>`)
                        .join('<span class="arrow">➔</span>');

                    targetCharDisplay.textContent = data.nextChar;
                }

                // 待機中の通知が来た場合
                else if (data.type === "waiting") {
                    turnIndicator.textContent = data.message;
                    sendButton.disabled = true;
                    nextWordInput.disabled = true;
                }

                // ゲーム開始、または通常の単語更新の場合
                else if (data.type === "game_start" || data.type === "success") {
                    historyContainer.innerHTML = data.recentWords
                        .map(word => `<span class="history-word">${word}</span>`)
                        .join('<span class="arrow">➔</span>');

                    targetCharDisplay.textContent = data.nextChar;
                    nextWordInput.value = "";

                    if (data.role === "spectator") {
                        turnIndicator.textContent = "観戦中";
                        sendButton.disabled = true;
                        nextWordInput.disabled = true;
                    } else {
                        if (data.isYourTurn) {
                            turnIndicator.textContent = "自分のターン";
                            sendButton.disabled = false;
                            nextWordInput.disabled = false;
                            nextWordInput.focus();
                        } else {
                            turnIndicator.textContent = "相手のターン（考え中…）";
                            sendButton.disabled = true;
                            nextWordInput.disabled = true;
                        }
                    }
                }
            };

            socket.onclose = () => {
                console.log("WebSocket接続が閉じられました。");
            };
        }

        // 送信ボタンの押下時
        sendButton.onclick = () => {
            const nextWordInputText = nextWordInput.value.trim();
            const regex = /^[ぁ-んァ-ヶー]+$/;

            if (!nextWordInputText) return;
            if (!regex.test(nextWordInputText)) {
                alert("ひらがな、またはカタカナだけで入力してください！");
                return;
            }

            socket.send(nextWordInputText);
        };

        // エンターキーでも送信できるようにサポート
        nextWordInput.onkeydown = (event) => {
            if (event.key === "Enter" && !sendButton.disabled) {
                sendButton.click();
            }
        };

        window.onload = async () => {
            connect();

            try {
                const response = await fetch(`/shiritori?room=${encodeURIComponent(roomName)}`, { method: "GET" });
                if (response.ok) {
                    const data = await response.json();
                    if (data.recentWords) {
                        historyContainer.innerHTML = data.recentWords
                            .map(word => `<span class="history-word">${word}</span>`)
                            .join('<span class="arrow">➔</span>');
                    }
                    if (data.nextChar) {
                        targetCharDisplay.textContent = data.nextChar;
                    }
                }
            } catch (err) {
                console.log("初期データ取得APIが設定されていない、またはエラー（WebSocket側で補完されます）");
            }
        };
    </script>
</body>

</html>
